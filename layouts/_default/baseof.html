<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode | default "en" }}">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=10.0, user-scalable=yes">
  <link rel="profile" href="http://gmpg.org/xfn/11">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <link rel="canonical" href="{{ .Permalink }}">
  {{ with .OutputFormats.Get "rss" }}
  <link rel="alternate" type="application/rss+xml" title="{{ $.Site.Title }}" href="{{ .Permalink }}">
  {{ end }}
  <link href='https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@300;400;600&family=Inter:wght@400;500;600;700&display=swap' rel='stylesheet'>
  <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"> -->
  <link rel="icon" href='{{ "favicon.ico" | relURL }}'>
  <link rel="stylesheet" href='{{ "css/blog.css" | relURL }}'>
  {{ block "head" . }}{{ end }}
  {{ partial "google_analytics.html" . }}
</head>

<body>
  {{ partial "blog/header.html" . }}

  <main id="main" class="content-area">
    <div class="main-content">
      {{ block "main" . }}{{ end }}
    </div>
    <div>
      {{ partial "blog/sidebar.html" . }}
    </div>
  </main>

  {{ partial "blog/footer.html" . }}
</body>

</html>
